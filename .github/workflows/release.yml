name: Release artifact

# On a published GitHub Release, build the update artifact the in-Worker updater deploys from (#32)
# and attach it to that release. The artifact is reproducible from the tag alone, so this job carries
# no account state and needs only the token GitHub grants it to upload assets.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  WRANGLER_SEND_METRICS: false

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Generate Worker binding types
        run: bun run cf-typegen

      - name: Build the admin SPA and the Worker bundle
        run: bun run build

      - name: Pack the release artifact
        run: bun run build:artifact

      - name: Attach the artifact and its checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            artifact/hedge-*.tar.gz \
            artifact/hedge-*.tar.gz.sha256 \
            --clobber
